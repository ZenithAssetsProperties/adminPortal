services:
  db:
    image: postgres:16-alpine
    container_name: zenith-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: zenith
      POSTGRES_DB: zenith
    ports:
      - "54329:5432"
    volumes:
      - zenith_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith -d zenith"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zenith_pg_data:
    driver: local
